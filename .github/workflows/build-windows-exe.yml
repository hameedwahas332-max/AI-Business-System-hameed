name: Build Windows x64 NSIS Desktop Installer & Signed Auto-Updater

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri-windows:
    name: Build Standalone Windows .exe Installer & Signed Updater
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract Authoritative Semantic Version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "AUTHORITATIVE_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "RELEASE_TAG=v${VERSION}" >> $GITHUB_ENV
          echo "Target Release Version: ${VERSION}"

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Prepare Windows Native Tooling & Dependencies
        shell: bash
        run: |
          echo "Removing Linux package-lock.json for clean Windows cross-resolution..."
          rm -f package-lock.json
          npm install --include=optional --legacy-peer-deps
          npm install --no-save --legacy-peer-deps @rollup/rollup-win32-x64-msvc @esbuild/win32-x64 @tauri-apps/cli@^2.0.0

      - name: Generate Binary Icons (ICO and PNG)
        shell: bash
        run: |
          node scripts/generate-tauri-icons.mjs

      - name: Validate TypeScript Codebase
        shell: bash
        run: |
          npx tsc --noEmit

      - name: Build Frontend Production Distribution
        shell: bash
        run: |
          npm run build

      - name: Verify Signing Key Presence
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error ::Missing TAURI_SIGNING_PRIVATE_KEY secret in GitHub Actions. Auto-updater artifacts cannot be signed!"
            exit 1
          fi
          echo "Tauri private signing key is verified in repository secrets."

      - name: Compile Tauri NSIS Installer & Signed Updater Bundle
        shell: bash
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || 'WahasERP@2026' }}
        run: |
          npx tauri build --target x86_64-pc-windows-msvc --bundles nsis --ci

      - name: Generate Auto-Update Manifest (latest.json)
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          node scripts/generate-update-manifest.mjs

      - name: Upload NSIS .exe Installer & Updater Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wahas-ERP-Windows-x64-Package-v${{ env.AUTHORITATIVE_VERSION }}
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.zip
            src-tauri/target/release/bundle/nsis/*.zip
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/*.sig
            latest.json
          retention-days: 30
          if-no-files-found: error

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: 'Wahas ERP Enterprise v${{ env.AUTHORITATIVE_VERSION }} (Windows Setup & Signed Auto-Update)'
          body: |
            ## Wahas ERP Enterprise Standalone Windows x64 Desktop Application
            - **Release Version**: v${{ env.AUTHORITATIVE_VERSION }}
            - **Architecture**: Windows x64 (NSIS Standalone Installer & Signed Updater)
            - **Security**: Cryptographically signed using Ed25519 Minisign
            - **Data Preservation Guarantee**: SQLite local database & session permanence verified
            - **Commit**: ${{ github.sha }}
            - **In-App Auto-Update**: Run the installed app or check for updates in the Update Center
          draft: false
          prerelease: false
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.zip
            src-tauri/target/release/bundle/nsis/*.zip
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/*.sig
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
