name: Build Windows x64 NSIS Desktop Installer

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri-windows:
    name: Build Standalone Windows .exe Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Prepare Windows Native Tooling & Dependencies
        shell: bash
        run: |
          echo "Removing Linux package-lock.json for clean Windows cross-resolution..."
          rm -f package-lock.json
          npm install --include=optional --legacy-peer-deps
          npm install --no-save --legacy-peer-deps @rollup/rollup-win32-x64-msvc @esbuild/win32-x64 @tauri-apps/cli@^2.0.0

      - name: Generate Binary Icons (ICO and PNG)
        shell: bash
        run: |
          node scripts/generate-tauri-icons.mjs

      - name: Validate TypeScript Codebase
        shell: bash
        run: |
          npx tsc --noEmit

      - name: Build Frontend Production Distribution
        shell: bash
        run: |
          npm run build

      - name: Compile Tauri NSIS Installer via CLI
        shell: bash
        run: |
          npx tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Upload NSIS .exe Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wahas-ERP-Windows-x64-Installer
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
          if-no-files-found: warn

      - name: Create Dynamic GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v2.5.${{ github.run_number }}
          name: 'Wahas ERP Enterprise v2.5.${{ github.run_number }} (Windows Setup)'
          body: |
            ## Wahas ERP Enterprise Standalone Windows x64 Desktop Application
            - **Build**: v2.5.${{ github.run_number }}
            - **Architecture**: Windows x64 (NSIS Installer)
            - **Offline Sync Engine**: SQLite WAL Durability + Transactional Outbox
            - **Commit**: ${{ github.sha }}
          draft: false
          prerelease: false
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
