name: Build Windows x64 NSIS Desktop Installer

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri-windows:
    name: Build Standalone Windows .exe Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Typecheck and Validate TypeScript
        run: npx tsc --noEmit

      - name: Build Frontend Production Assets
        run: npm run build

      - name: Build Tauri Desktop Standalone Bundle (NSIS .exe)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v2.4.0
          releaseName: 'Wahas ERP Enterprise v2.4.0 (Windows Setup)'
          releaseBody: 'Release of Wahas ERP Enterprise Standalone Windows x64 Desktop Application with SQLite WAL Offline Sync Engine.'
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      - name: Upload NSIS .exe Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Business-System-Setup-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          retention-days: 30
          if-no-files-found: warn
