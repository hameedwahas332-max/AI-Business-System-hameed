name: Build Windows x64 NSIS Desktop Installer & Signed Auto-Updater

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri-windows:
    name: Build Standalone Windows .exe Installer & Signed Updater
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compute Dynamic Version & Inject Into Package Configs
        shell: bash
        env:
          RUN_NUM: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          RUN_NUM="${RUN_NUM:-1}"
          DYNAMIC_VERSION="1.1.${RUN_NUM}"
          export DYNAMIC_VERSION
          echo "DYNAMIC_VERSION=${DYNAMIC_VERSION}" >> $GITHUB_ENV
          echo "AUTHORITATIVE_VERSION=${DYNAMIC_VERSION}" >> $GITHUB_ENV
          echo "RELEASE_TAG=v${DYNAMIC_VERSION}" >> $GITHUB_ENV
          echo "VITE_BUILD_COMMIT_SHA=${COMMIT_SHA}" >> $GITHUB_ENV
          echo "VITE_APP_VERSION=${DYNAMIC_VERSION}" >> $GITHUB_ENV
          echo "Computed Dynamic Build Version: ${DYNAMIC_VERSION} (Commit: ${COMMIT_SHA})"

          node -e "
            const fs = require('fs');
            const runNum = process.env.RUN_NUM || '1';
            const ver = process.env.DYNAMIC_VERSION || ('1.1.' + runNum);

            if (!ver || ver.includes('undefined')) {
              console.error('FATAL: Invalid version string: ' + ver);
              process.exit(1);
            }

            // 1. Update package.json
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = ver;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

            // 2. Update src-tauri/tauri.conf.json
            const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            tauri.version = ver;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauri, null, 2) + '\n');

            // 3. Update src-tauri/Cargo.toml
            if (fs.existsSync('src-tauri/Cargo.toml')) {
              let cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
              cargo = cargo.replace(/^version\s*=\s*\"[^\"]+\"/m, 'version = \"' + ver + '\"');
              fs.writeFileSync('src-tauri/Cargo.toml', cargo);
            }

            console.log('Successfully injected dynamic version ' + ver + ' into package.json, tauri.conf.json, and Cargo.toml');
          "

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Verify Cargo Metadata & Cargo.toml Syntax
        shell: bash
        run: |
          echo "Verifying src-tauri Cargo.toml validity..."
          cd src-tauri
          cargo metadata --no-deps --format-version 1
          cd ..
          echo "Cargo.toml metadata verified successfully!"

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Prepare Windows Native Tooling & Dependencies
        shell: bash
        run: |
          echo "Removing Linux package-lock.json for clean Windows cross-resolution..."
          rm -f package-lock.json
          npm install --include=optional --legacy-peer-deps
          npm install --no-save --legacy-peer-deps @rollup/rollup-win32-x64-msvc @esbuild/win32-x64 @tauri-apps/cli@^2.0.0

      - name: Generate Binary Icons (ICO and PNG)
        shell: bash
        run: |
          node scripts/generate-tauri-icons.mjs

      - name: Validate TypeScript Codebase
        shell: bash
        run: |
          npx tsc --noEmit

      - name: Build Frontend Production Distribution
        shell: bash
        env:
          VITE_BUILD_COMMIT_SHA: ${{ github.sha }}
          VITE_APP_VERSION: ${{ env.DYNAMIC_VERSION }}
        run: |
          npm run build

      - name: Verify Signing Key Presence
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error ::Missing TAURI_SIGNING_PRIVATE_KEY secret in GitHub Actions. Auto-updater artifacts cannot be signed!"
            exit 1
          fi
          echo "Tauri private signing key is verified in repository secrets."

      - name: Compile Tauri NSIS Installer & Signed Updater Bundle
        shell: bash
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx tauri build --target x86_64-pc-windows-msvc --bundles nsis --ci

      - name: Generate Auto-Update Manifest (latest.json)
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          GITHUB_SHA: ${{ github.sha }}
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_NOTES: "تحديث معتمد لنظام وهاس ERP (الإصدار v${{ env.AUTHORITATIVE_VERSION }}) - Commit: ${{ github.sha }}"
        run: |
          node scripts/generate-update-manifest.mjs

      - name: Stage Deduplicated Release Assets
        shell: pwsh
        run: |
          Write-Host "Creating clean release staging directory 'release-assets/'..."
          if (Test-Path "release-assets") {
            Remove-Item -Recurse -Force "release-assets"
          }
          New-Item -ItemType Directory -Path "release-assets" | Out-Null

          # 1. Locate NSIS bundle folder
          $candidateDirs = @(
            "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis",
            "src-tauri/target/release/bundle/nsis"
          )
          $nsisDir = $null
          foreach ($dir in $candidateDirs) {
            if (Test-Path $dir) {
              $nsisDir = $dir
              break
            }
          }

          if (-not $nsisDir) {
            Write-Error "FATAL: Could not locate NSIS bundle directory in candidates: $($candidateDirs -join ', ')"
            exit 1
          }
          Write-Host "Located NSIS bundle directory: $nsisDir"

          # 2. Find canonical dot-sanitized installer and signature
          $versionedInstaller = Get-ChildItem -Path $nsisDir -Filter "AI.Business.System*_x64-setup.exe" | Select-Object -First 1
          if (-not $versionedInstaller) {
            $versionedInstaller = Get-ChildItem -Path $nsisDir -Filter "*_x64-setup.exe" | Where-Object { $_.Name -notlike "*Setup.exe" } | Select-Object -First 1
          }

          if (-not $versionedInstaller) {
            Write-Error "FATAL: No versioned installer found in $nsisDir"
            exit 1
          }

          $destInstallerName = $versionedInstaller.Name.Replace(" ", ".")
          Copy-Item -Path $versionedInstaller.FullName -Destination "release-assets/$destInstallerName" -Force
          Write-Host "Staged canonical installer: $destInstallerName"

          # Find and copy matching signature
          $sigFile = Get-ChildItem -Path $nsisDir -Filter "$($versionedInstaller.Name).sig" | Select-Object -First 1
          if (-not $sigFile) {
            $sigFile = Get-ChildItem -Path $nsisDir -Filter "$destInstallerName.sig" | Select-Object -First 1
          }
          if ($sigFile) {
            Copy-Item -Path $sigFile.FullName -Destination "release-assets/$destInstallerName.sig" -Force
            Write-Host "Staged signature: $destInstallerName.sig"
          } else {
            Write-Warning "Signature file for $($versionedInstaller.Name) was not found."
          }

          # 3. Create fixed-name installer copy (and signature copy)
          Copy-Item -Path "release-assets/$destInstallerName" -Destination "release-assets/AI-Business-System-Setup.exe" -Force
          Write-Host "Staged fixed-name installer alias: AI-Business-System-Setup.exe"

          if (Test-Path "release-assets/$destInstallerName.sig") {
            Copy-Item -Path "release-assets/$destInstallerName.sig" -Destination "release-assets/AI-Business-System-Setup.exe.sig" -Force
            Write-Host "Staged fixed-name signature alias: AI-Business-System-Setup.exe.sig"
          }

          # 4. Copy latest.json from repository root
          if (Test-Path "latest.json") {
            Copy-Item -Path "latest.json" -Destination "release-assets/latest.json" -Force
            Write-Host "Staged updater manifest: latest.json"
          } else {
            Write-Error "FATAL: latest.json not found in repository root!"
            exit 1
          }

          # 5. Explicit space-free validation & deduplication
          $stagedFiles = Get-ChildItem -Path "release-assets"
          foreach ($file in $stagedFiles) {
            if ($file.Name.Contains(" ")) {
              $cleanName = $file.Name.Replace(" ", ".")
              $cleanPath = Join-Path "release-assets" $cleanName
              if (Test-Path $cleanPath) {
                Remove-Item -Force $file.FullName
              } else {
                Rename-Item -Path $file.FullName -NewName $cleanName -Force
              }
              Write-Host "Sanitized spaced file: $($file.Name) -> $cleanName"
            }
          }

          Write-Host "`n=== FINAL STAGED RELEASE ASSETS ==="
          Get-ChildItem -Path "release-assets" | ForEach-Object {
            Write-Host "  - $($_.Name) ($($_.Length) bytes)"
          }

      - name: Upload NSIS .exe Installer & Updater Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wahas-ERP-Windows-x64-Package-v${{ env.AUTHORITATIVE_VERSION }}
          path: |
            release-assets/*
          retention-days: 30
          if-no-files-found: error

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: 'Wahas ERP Enterprise v${{ env.AUTHORITATIVE_VERSION }} (Windows Setup & Signed Auto-Update)'
          body: |
            ## Wahas ERP Enterprise Standalone Windows x64 Desktop Application
            - **Release Version**: v${{ env.AUTHORITATIVE_VERSION }}
            - **Architecture**: Windows x64 (NSIS Standalone Installer & Signed Updater)
            - **Security**: Cryptographically signed using Ed25519 Minisign
            - **Data Preservation Guarantee**: SQLite local database & session permanence verified
            - **Commit**: ${{ github.sha }}
            - **In-App Auto-Update**: Run the installed app or check for updates in the Update Center
          draft: false
          prerelease: false
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
