name: Enterprise ERP Quality Gate (CI)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Typecheck, Accounting Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Strict TypeScript Typecheck
        run: npm run typecheck

      - name: Run Accounting & Multi-Tenant Isolation Tests
        run: npm test

      - name: Verify Production Build
        run: npm run build
