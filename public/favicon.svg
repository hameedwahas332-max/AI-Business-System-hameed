<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#14213d" />
      <stop offset="50%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#04070e" />
    </radialGradient>
    <linearGradient id="tileBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldRoof" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    
    <linearGradient id="goldBarLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="goldBarMid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="goldBarRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <radialGradient id="goldNode" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>

    <linearGradient id="goldWire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Emerald Gradients -->
    <linearGradient id="emeraldWingLeftOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="80%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <linearGradient id="emeraldWingLeftInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <linearGradient id="emeraldWingRightOuter" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="80%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <linearGradient id="emeraldWingRightInner" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <linearGradient id="emeraldChevronTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="emeraldChevronLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="emeraldChevronRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <linearGradient id="emeraldVBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Drop Shadows & Ambient Glows -->
    <filter id="outerShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <filter id="emblemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#047857" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- 1. Squircle App Tile Background -->
  <rect x="24" y="24" width="464" height="464" rx="100" ry="100" fill="url(#bgGlow)" filter="url(#outerShadow)" />
  <rect x="24" y="24" width="464" height="464" rx="100" ry="100" fill="none" stroke="url(#tileBorder)" stroke-width="2.5" />
  
  <!-- Subtle top inner highlight rim for tile -->
  <path d="M 124 26 L 388 26 C 440 26 470 56 480 100" fill="none" stroke="#475569" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- 2. Main Emblem Group -->
  <g filter="url(#emblemGlow)">

    <!-- Top Gold Canopy Frame (Hexagonal Roof) -->
    <path d="M 256 68 L 366 130 L 354 148 L 256 94 L 158 148 L 146 130 Z"
          fill="url(#goldRoof)" filter="url(#goldGlow)" />

    <!-- 3 Rising Gold Financial Bars (Inside Canopy) -->
    <!-- Left Bar (Lowest) -->
    <path d="M 218 152 L 234 152 L 234 186 L 218 186 Z" fill="url(#goldBarLeft)" rx="3" />
    <path d="M 231 152 L 234 152 L 234 186 L 231 186 Z" fill="#b45309" />
    
    <!-- Middle Bar (Medium) -->
    <path d="M 244 134 L 260 134 L 260 186 L 244 186 Z" fill="url(#goldBarMid)" rx="3" />
    <path d="M 257 134 L 260 134 L 260 186 L 257 186 Z" fill="#b45309" />

    <!-- Right Bar (Tallest) -->
    <path d="M 270 114 L 286 114 L 286 186 L 270 186 Z" fill="url(#goldBarRight)" rx="3" />
    <path d="M 283 114 L 286 114 L 286 186 L 283 186 Z" fill="#b45309" />

    <!-- 3. Outer Emerald Wings / Shield Collar -->
    
    <!-- Left Wing Outer Facet -->
    <path d="M 148 132 L 86 168 L 86 280 L 256 436 L 256 396 L 126 270 L 126 186 L 148 174 Z"
          fill="url(#emeraldWingLeftOuter)" />
    
    <!-- Left Wing Inner Facet (Chiseled bevel) -->
    <path d="M 148 132 L 148 248 L 188 288 L 188 154 Z"
          fill="url(#emeraldWingLeftInner)" />
    <path d="M 148 132 L 188 154 L 148 174 Z"
          fill="#34d399" />

    <!-- Right Wing Outer Facet -->
    <path d="M 364 132 L 426 168 L 426 280 L 256 436 L 256 396 L 386 270 L 386 186 L 364 174 Z"
          fill="url(#emeraldWingRightOuter)" />

    <!-- Right Wing Inner Facet (Chiseled bevel) -->
    <path d="M 364 132 L 364 248 L 324 288 L 324 154 Z"
          fill="url(#emeraldWingRightInner)" />
    <path d="M 364 132 L 324 154 L 364 174 Z"
          fill="#10b981" />

    <!-- Bottom Outer V-Apex Joint -->
    <path d="M 256 396 L 256 436 L 256 436 Z" fill="url(#emeraldVBottom)" />

    <!-- 4. Gold Circuit Trace Wires & Connection Nodes -->
    
    <!-- Left Wing Wire -->
    <path d="M 148 226 L 188 252" stroke="url(#goldWire)" stroke-width="7" stroke-linecap="round" />
    
    <!-- Right Wing Wire -->
    <path d="M 364 226 L 324 252" stroke="url(#goldWire)" stroke-width="7" stroke-linecap="round" />

    <!-- Bottom V Wires -->
    <path d="M 188 316 L 256 376 L 324 316" fill="none" stroke="url(#goldWire)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 5. Central 3D Faceted Emerald Chevron / Prism -->
    
    <!-- Top Slanted Diamond Facet (Highlight) -->
    <path d="M 256 198 L 324 252 L 256 296 L 188 252 Z"
          fill="url(#emeraldChevronTop)" />
    
    <!-- Left Vertical 3D Drop Facet -->
    <path d="M 188 252 L 256 296 L 256 360 L 188 316 Z"
          fill="url(#emeraldChevronLeft)" />

    <!-- Right Vertical 3D Drop Facet -->
    <path d="M 324 252 L 256 296 L 256 360 L 324 316 Z"
          fill="url(#emeraldChevronRight)" />

    <!-- Central Ridge Crease Highlight -->
    <path d="M 256 198 L 256 296 L 256 360" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8" />
    
    <!-- Top Crest Specular Highlight Edge -->
    <path d="M 188 252 L 256 198 L 324 252" fill="none" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round" />

    <!-- 6. Polished Gold Spherical Circuit Nodes -->
    <!-- Left Node -->
    <circle cx="148" cy="226" r="15" fill="url(#goldNode)" filter="url(#goldGlow)" />
    
    <!-- Right Node -->
    <circle cx="364" cy="226" r="15" fill="url(#goldNode)" filter="url(#goldGlow)" />
    
    <!-- Bottom Center Node -->
    <circle cx="256" cy="376" r="15" fill="url(#goldNode)" filter="url(#goldGlow)" />

  </g>
</svg>
