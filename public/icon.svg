<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial & Linear Gradients -->
    <radialGradient id="luxFavBgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="35%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <linearGradient id="luxFavTileOuterRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#334155" stop-opacity="0.3" />
      <stop offset="75%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="luxFavTileInnerRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.65" />
    </linearGradient>

    <!-- 24K Polished Gold Gradients -->
    <linearGradient id="luxFavGoldCrown" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="18%" stop-color="#d97706" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fffbeb" />
      <stop offset="65%" stop-color="#fbbf24" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="luxFavGoldRoofFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- 4 Stepped Financial Bars -->
    <linearGradient id="luxFavGoldBar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="45%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="luxFavGoldBar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="45%" stop-color="#fef9c3" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="luxFavGoldBar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="45%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="luxFavGoldBar4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="40%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Rich Emerald Jewels & Facets -->
    <linearGradient id="luxFavEmeraldWingLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="25%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="90%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <linearGradient id="luxFavEmeraldWingLeftInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="45%" stop-color="#059669" />
      <stop offset="85%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <linearGradient id="luxFavEmeraldWingRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="25%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="90%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <linearGradient id="luxFavEmeraldWingRightInner" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="45%" stop-color="#059669" />
      <stop offset="85%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <linearGradient id="luxFavEmeraldApexDiamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="35%" stop-color="#34d399" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="luxFavEmeraldApexLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="luxFavEmeraldApexRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Polished Gold Spherical Circuit Nodes -->
    <radialGradient id="luxFavGoldNodeSphere" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="22%" stop-color="#fef08a" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>

    <linearGradient id="luxFavGoldWire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Prominence Filters -->
    <filter id="luxFavTileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="luxFavEmblemDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#047857" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <filter id="luxFavGoldHighlight" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#fbbf24" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 1. Luxurious Squircle App Tile -->
  <g filter="url(#luxFavTileShadow)">
    <rect x="20" y="20" width="472" height="472" rx="108" ry="108" fill="url(#luxFavBgGlow)" />
    <rect x="20" y="20" width="472" height="472" rx="108" ry="108" fill="none" stroke="url(#luxFavTileOuterRim)" stroke-width="3.5" />
    <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="none" stroke="url(#luxFavTileInnerRim)" stroke-width="2" />
    <path d="M 120 23 L 392 23 C 445 23 475 53 487 106" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-opacity="0.4" />
  </g>

  <!-- 2. Main Executive Crest Group -->
  <g filter="url(#luxFavEmblemDepth)">
    <!-- Top Imperial Canopy Arch (Hexagonal Crown Roof) -->
    <path d="M 256 56 L 378 126 L 364 146 L 256 86 L 148 146 L 134 126 Z" fill="url(#luxFavGoldCrown)" filter="url(#luxFavGoldHighlight)" />
    <path d="M 256 56 L 256 86 L 364 146 L 378 126 Z" fill="url(#luxFavGoldRoofFace)" opacity="0.9" />

    <!-- Apex Sparkle Star (Diamond Brilliance) -->
    <path d="M 256 40 L 260 52 L 272 56 L 260 60 L 256 72 L 252 60 L 240 56 L 252 52 Z" fill="#ffffff" filter="url(#luxFavGoldHighlight)" />

    <!-- 4 Stepped Ascending 3D Financial Growth Bars -->
    <path d="M 204 158 L 220 158 L 220 192 L 204 192 Z" fill="url(#luxFavGoldBar1)" rx="2.5" />
    <path d="M 217 158 L 220 158 L 220 192 L 217 192 Z" fill="#92400e" />

    <path d="M 228 142 L 244 142 L 244 192 L 228 192 Z" fill="url(#luxFavGoldBar2)" rx="2.5" />
    <path d="M 241 142 L 244 142 L 244 192 L 241 192 Z" fill="#92400e" />

    <path d="M 252 124 L 268 124 L 268 192 L 252 192 Z" fill="url(#luxFavGoldBar3)" rx="2.5" />
    <path d="M 265 124 L 268 124 L 268 192 L 265 192 Z" fill="#92400e" />

    <path d="M 276 102 L 292 102 L 292 192 L 276 192 Z" fill="url(#luxFavGoldBar4)" rx="2.5" />
    <path d="M 289 102 L 292 102 L 292 192 L 289 192 Z" fill="#78350f" />

    <!-- 3. Outer Emerald Wings (Majestic Shield Frame) -->
    <path d="M 136 128 L 74 166 L 74 286 L 256 446 L 256 404 L 116 276 L 116 186 L 136 172 Z" fill="url(#luxFavEmeraldWingLeft)" />
    <path d="M 136 128 L 136 252 L 180 294 L 180 152 Z" fill="url(#luxFavEmeraldWingLeftInner)" />
    <path d="M 136 128 L 180 152 L 136 172 Z" fill="#34d399" />

    <path d="M 376 128 L 438 166 L 438 286 L 256 446 L 256 404 L 396 276 L 396 186 L 376 172 Z" fill="url(#luxFavEmeraldWingRight)" />
    <path d="M 376 128 L 376 252 L 332 294 L 332 152 Z" fill="url(#luxFavEmeraldWingRightInner)" />
    <path d="M 376 128 L 332 152 L 376 172 Z" fill="#10b981" />

    <path d="M 256 404 L 256 446 L 256 446 Z" fill="#047857" />

    <!-- 4. Gold Neural Circuit Wires (Smart ERP Connectivity) -->
    <path d="M 136 230 L 180 258" stroke="url(#luxFavGoldWire)" stroke-width="7.5" stroke-linecap="round" />
    <path d="M 376 230 L 332 258" stroke="url(#luxFavGoldWire)" stroke-width="7.5" stroke-linecap="round" />
    <path d="M 180 324 L 256 388 L 332 324" fill="none" stroke="url(#luxFavGoldWire)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />

    <path d="M 180 258 L 220 286" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />
    <path d="M 332 258 L 292 286" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />

    <!-- 5. Central 3D Faceted Emerald Diamond Chevron (The Smart Engine) -->
    <path d="M 256 198 L 332 258 L 256 306 L 180 258 Z" fill="url(#luxFavEmeraldApexDiamond)" />
    <path d="M 180 258 L 256 306 L 256 376 L 180 324 Z" fill="url(#luxFavEmeraldApexLeft)" />
    <path d="M 332 258 L 256 306 L 256 376 L 332 324 Z" fill="url(#luxFavEmeraldApexRight)" />

    <path d="M 256 198 L 256 306 L 256 376" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.95" />
    <path d="M 180 258 L 256 198 L 332 258" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />

    <!-- 6. Polished 24K Gold Spherical Circuit Nodes -->
    <circle cx="136" cy="230" r="16" fill="url(#luxFavGoldNodeSphere)" filter="url(#luxFavGoldHighlight)" />
    <circle cx="132" cy="226" r="4" fill="#ffffff" opacity="0.85" />

    <circle cx="376" cy="230" r="16" fill="url(#luxFavGoldNodeSphere)" filter="url(#luxFavGoldHighlight)" />
    <circle cx="372" cy="226" r="4" fill="#ffffff" opacity="0.85" />

    <circle cx="256" cy="388" r="17" fill="url(#luxFavGoldNodeSphere)" filter="url(#luxFavGoldHighlight)" />
    <circle cx="252" cy="384" r="4.5" fill="#ffffff" opacity="0.9" />

    <polygon points="256,238 266,252 256,266 246,252" fill="#fef08a" filter="url(#luxFavGoldHighlight)" />
  </g>
</svg>
